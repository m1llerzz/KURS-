<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
  /* Р¦РІРµС‚Р° Р±РµСЂС‘Рј РёР· С‚РµРјС‹ Telegram. Р—РЅР°С‡РµРЅРёСЏ РїРѕСЃР»Рµ Р·Р°РїСЏС‚РѕР№ вЂ” Р·Р°РїР°СЃРЅС‹Рµ,
     РЅР° СЃР»СѓС‡Р°Р№ РµСЃР»Рё СЃС‚СЂР°РЅРёС†Сѓ РѕС‚РєСЂС‹Р»Рё РІ РѕР±С‹С‡РЅРѕРј Р±СЂР°СѓР·РµСЂРµ. */
  :root {
    --bg:      var(--tg-theme-bg-color, #ffffff);
    --surface: var(--tg-theme-secondary-bg-color, #f4f7fa);
    --ink:     var(--tg-theme-text-color, #101820);
    --muted:   var(--tg-theme-hint-color, #6b7a8a);
    --accent:  var(--tg-theme-button-color, #0f6a8b);
    --accent-ink: var(--tg-theme-button-text-color, #ffffff);
    --line:    color-mix(in srgb, var(--ink) 12%, transparent);
    --alert:   #c0392b;
    --alert-bg: color-mix(in srgb, var(--alert) 10%, transparent);
    /* РћСЃС‚РѕСЂРѕР¶РЅРѕСЃС‚СЊ, Р° РЅРµ С‚СЂРµРІРѕРіР°. РљСЂР°СЃРЅС‹Р№ РІ СЌС‚РѕРј РїСЂРѕРґСѓРєС‚Рµ Р·Р°РЅСЏС‚ РѕС€РёР±РєР°РјРё
       РІРІРѕРґР° вЂ” РµСЃР»Рё РєСЂР°СЃРёС‚СЊ РёРј РµС‰С‘ Рё РїР»РѕС…РѕР№ РєСѓСЂСЃ, С‡РµР»РѕРІРµРє РїРµСЂРµСЃС‚Р°С‘С‚
       СЂР°Р·Р»РёС‡Р°С‚СЊ В«С‚С‹ РѕС€РёР±СЃСЏВ» Рё В«СЃРµРіРѕРґРЅСЏ РЅРµРІС‹РіРѕРґРЅРѕВ». РЇРЅС‚Р°СЂРЅС‹Р№ С‡РёС‚Р°РµС‚СЃСЏ
       РєР°Рє В«РїСЂРёС‚РѕСЂРјРѕР·РёВ» Рё РЅРµ РєСЂРёС‡РёС‚. */
    --warn:    #b8791f;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 14px 14px 32px;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    position: relative;
  }

  /* Р¤РѕРЅ вЂ” СЃРІРµС‡РµРЅРёРµ Р°РєС†РµРЅС‚РѕРј СЃРІРµСЂС…Сѓ, РѕС‚РґРµР»СЊРЅС‹Рј СЃР»РѕРµРј РїРѕРґ СЃРѕРґРµСЂР¶РёРјС‹Рј.
     РџСЃРµРІРґРѕСЌР»РµРјРµРЅС‚, Р° РЅРµ background: С‚Р°Рє РѕРЅ РѕРґРёРЅР°РєРѕРІРѕ Р»РѕР¶РёС‚СЃСЏ Рё РЅР° СЃРІРµС‚Р»СѓСЋ,
     Рё РЅР° С‚С‘РјРЅСѓСЋ С‚РµРјСѓ Telegram. РќРёС‡РµРіРѕ РЅРµ РїРµСЂРµС…РІР°С‚С‹РІР°РµС‚ РїРѕ РЅР°Р¶Р°С‚РёСЏРј. */
  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 260px;
    background: linear-gradient(180deg, var(--accent), transparent);
    opacity: .16;
    pointer-events: none;
    z-index: 0;
  }
  .wrap, .langs { position: relative; z-index: 1; }

  .wrap { display: flex; flex-direction: column; gap: 13px; max-width: 480px; margin: 0 auto; }

  .lbl {
    font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase;
    color: var(--muted); font-weight: 700;
  }

  .field {
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    padding: 10px 13px; display: flex; flex-direction: column; gap: 2px;
  }
  .field input, .field select {
    background: transparent; border: none; color: var(--ink);
    font-family: inherit; font-size: 21px; font-weight: 700; width: 100%;
    padding: 0; font-variant-numeric: tabular-nums;
  }
  /* Р Р°СЃРєСЂС‹С‚С‹Р№ СЃРїРёСЃРѕРє СЂРёСЃСѓРµС‚ СЃРёСЃС‚РµРјР°, Рё С„РѕРЅ Сѓ РЅРµРіРѕ СЃРІРѕР№ вЂ” РїРѕС‡С‚Рё РІСЃРµРіРґР° Р±РµР»С‹Р№.
     Р¦РІРµС‚ С‚РµРєСЃС‚Р° РЅР°СЃР»РµРґСѓРµС‚СЃСЏ РѕС‚ С‚РµРјС‹, РїРѕСЌС‚РѕРјСѓ РІ С‚С‘РјРЅРѕР№ С‚РµРјРµ РїСѓРЅРєС‚С‹
     РѕРєР°Р·С‹РІР°Р»РёСЃСЊ СЃРІРµС‚Р»С‹РјРё РЅР° Р±РµР»РѕРј. Р—Р°РґР°С‘Рј РїР°СЂРµ С„РѕРЅ Рё С‚РµРєСЃС‚ СЏРІРЅРѕ. */
  .field select option { background: var(--bg); color: var(--ink); }
  .field select { font-size: 16px; font-weight: 600; }
  .field input:focus, .field select:focus { outline: none; }
  .field:focus-within { border-color: var(--accent); }
  .field .hint { font-size: 12px; color: var(--muted); }

  button {
    font-family: inherit; font-size: 15px; font-weight: 700;
    border: none; border-radius: 12px; padding: 14px; width: 100%; cursor: pointer;
    background: var(--accent); color: var(--accent-ink);
  }
  /* РўРµРєСЃС‚ РєСЂР°СЃРёРј РІ --ink, Р° РЅРµ РІ --accent: РІ С‚С‘РјРЅС‹С… С‚РµРјР°С… Telegram С†РІРµС‚
     РєРЅРѕРїРєРё Р±С‹РІР°РµС‚ РїРѕС‡С‚Рё С‡С‘СЂРЅС‹Рј, Рё РЅР°РґРїРёСЃСЊ РЅР° РїСЂРѕР·СЂР°С‡РЅРѕРј С„РѕРЅРµ РїСЂРѕРїР°РґР°РµС‚. */
  button.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--accent); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* в”Ђв”Ђ Р’РµСЂРґРёРєС‚ РґРЅСЏ в”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђ
     РџРµСЂРІС‹Р№ СЌРєСЂР°РЅ РїСЂРѕРґСѓРєС‚Р° Рё РµРіРѕ РіР»Р°РІРЅР°СЏ С†РµРЅРЅРѕСЃС‚СЊ. Р—Р° РјРµСЃСЏС† РєСѓСЂСЃ СЂСѓР±Р»СЏ
     РїСЂРѕС€С‘Р» 9,5% вЂ” СЌС‚Рѕ Р±РѕР»СЊС€Рµ РґРµРЅРµРі, С‡РµРј РІС‹Р±РѕСЂ СЃРµСЂРІРёСЃР° Рё Р±Р°РЅРєР° РІРјРµСЃС‚Рµ.
     РџРѕСЌС‚РѕРјСѓ С†РёС„СЂР° РґРЅСЏ СЃС‚РѕРёС‚ РІС‹С€Рµ С„РѕСЂРјС‹, Р° РЅРµ РїРѕРґ РЅРµР№. */
  .verdict {
    border-radius: 14px; padding: 15px 16px 13px;
    display: flex; flex-direction: column; gap: 9px;
    background: color-mix(in srgb, var(--tone) 12%, transparent);
    border: 1px solid color-mix(in srgb, var(--tone) 34%, transparent);
    --tone: var(--muted);
  }
  .verdict.good { --tone: var(--accent); }
  .verdict.bad  { --tone: var(--warn); }

  /* РЁР°РїРєР° РІРµСЂРґРёРєС‚Р°: СЃР»РµРІР° СЃР»РѕРІР°, СЃРїСЂР°РІР° Р·РЅР°С‡РѕРє СЃРѕСЃС‚РѕСЏРЅРёСЏ. Р—РЅР°С‡РѕРє РЅСѓР¶РµРЅ
     С‚РµРј, РєС‚Рѕ Р»РёСЃС‚Р°РµС‚ Р±С‹СЃС‚СЂРѕ Рё С‚РµРєСЃС‚ РЅРµ С‡РёС‚Р°РµС‚ РІРѕРІСЃРµ. */
  .verdict .vtop { display: flex; align-items: flex-start; gap: 10px; }
  .verdict .vh {
    font-size: 16.5px; font-weight: 800; line-height: 1.3;
    letter-spacing: -.01em; flex: 1;
  }
  .verdict .vbadge {
    flex: none; font-size: 11px; font-weight: 800; letter-spacing: .04em;

  .verdict .vnums { display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap; }

  /* Р“СЂР°С„РёРє РєСѓСЂСЃР°. РќР°СЃС‚РѕСЏС‰РёР№ СЂСЏРґ Р¦Р‘ Р·Р° 30 РґРЅРµР№: РѕРґРЅРѕ РґРІРёР¶РµРЅРёРµ РіР»Р°Р·РѕРј
     РѕР±СЉСЏСЃРЅСЏРµС‚ Р±РѕР»СЊС€Рµ, С‡РµРј Р°Р±Р·Р°С† С‚РµРєСЃС‚Р° РїСЂРѕ РІРѕР»Р°С‚РёР»СЊРЅРѕСЃС‚СЊ. */
  .chart { display: flex; flex-direction: column; gap: 3px; }
  /* color Р·Р°РґР°С‘С‚ currentColor РґР»СЏ РіСЂР°РґРёРµРЅС‚Р° Р·Р°Р»РёРІРєРё: С‚Р°Рє РѕРЅР° РїРѕРІС‚РѕСЂСЏРµС‚
     С†РІРµС‚ РІРµСЂРґРёРєС‚Р°, Рё РІС‚РѕСЂРѕРіРѕ РЅР°Р±РѕСЂР° РїСЂР°РІРёР» РїРѕРґ РєР°Р¶РґРѕРµ СЃРѕСЃС‚РѕСЏРЅРёРµ РЅРµ РЅСѓР¶РЅРѕ. */
  .spark { width: 100%; height: 58px; display: block; overflow: visible; color: var(--tone); }

  .spark .dt { fill: var(--tone); }
  /* РћСЂРµРѕР» РІРѕРєСЂСѓРі СЃРµРіРѕРґРЅСЏС€РЅРµР№ С‚РѕС‡РєРё: РЅР° РїР»РѕС‚РЅРѕРј СЂСЏРґСѓ РёР· С‚СЂРёРґС†Р°С‚Рё Р·РЅР°С‡РµРЅРёР№
     РѕР±С‹С‡РЅС‹Р№ РєСЂСѓР¶РѕРє С‚РµСЂСЏРµС‚СЃСЏ РІ Р»РёРЅРёРё. */

  /* РџРѕРґРїРёСЃРё РїРѕРґ РіСЂР°С„РёРєРѕРј: РєСЂР°Р№РЅРёРµ Р·РЅР°С‡РµРЅРёСЏ РјРµСЃСЏС†Р° Рё РїРµСЂРёРѕРґ. Р‘РµР· РЅРёС…
     Р»РёРЅРёСЏ РєСЂР°СЃРёРІР°СЏ, РЅРѕ Р±РµСЃСЃРјС‹СЃР»РµРЅРЅР°СЏ вЂ” РЅРµ СЃ С‡РµРј СЃСЂР°РІРЅРёС‚СЊ. */
  .chart .osi {
    display: flex; justify-content: space-between; gap: 8px;
    font-size: 10.5px; color: var(--muted); font-variant-numeric: tabular-nums;
  }

  /* РЁРєР°Р»Р° РјРµСЃСЏС†Р°: РіРґРµ СЃРµРіРѕРґРЅСЏС€РЅРёР№ РєСѓСЂСЃ РјРµР¶РґСѓ С…СѓРґС€РёРј Рё Р»СѓС‡С€РёРј РґРЅС‘Рј.
     РЎР°РјР°СЏ РїРѕРЅСЏС‚РЅР°СЏ С‡Р°СЃС‚СЊ СЌРєСЂР°РЅР° вЂ” РїРѕР»РѕР¶РµРЅРёРµ С‚РѕС‡РєРё С‡РёС‚Р°РµС‚СЃСЏ Р±РµР· С‡РёСЃРµР». */
  .scale {
    position: relative; height: 6px; border-radius: 999px; margin: 3px 0 1px;
    background: linear-gradient(90deg,

    transition: left .35s cubic-bezier(.2,.7,.3,1);

  /* в”Ђв”Ђ Р РµР·СѓР»СЊС‚Р°С‚ в”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђ */

  }

    font-variant-numeric: tabular-nums; letter-spacing: -.02em;
  }
  .loss .s { font-size: 12.5px; color: var(--muted); }
