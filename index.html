<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Qancha yetadi — сколько дойдёт</title>

<!-- Описание видно при пересылке ссылки в чат: это первое, что читает
     человек, которому переслали расчёт. Оба языка сразу, места хватает. -->
<meta name="description" content="Bugun yubormoqmi yoki kutmoqmi. Отправлять сегодня или подождать — и сколько реально дойдёт до карты.">
<meta property="og:title" content="Qancha yetadi">
<meta property="og:description" content="Kurs bugun odatdagidan yaxshimi yoki yomonmi va kartaga qancha yetib boradi. Лучше ли курс сегодня обычного и сколько дойдёт до карты.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://m1llerzz.github.io/KURS-/">

<!-- Картинка карточки. Ссылка уходит в каждой пересылке, а пересылка —
     единственный бесплатный источник роста, который у нас есть. Карточка
     без картинки выглядит в чате бледной строкой, и её пролистывают.
     Число на обложке живое: пересобирается `bot/sobrat_oblozhku.py`. -->
<meta property="og:image" content="https://m1llerzz.github.io/KURS-/oblozhka.png?v=20260814">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">

<!-- Среда Telegram: тема, кнопки, отправка в чат. Без этой строки мини-апп не работает. -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
  /* Цвета берём из темы Telegram. Значения после запятой — запасные,
     на случай если страницу открыли в обычном браузере. */
  :root {
    --bg:      var(--tg-theme-bg-color, #ffffff);
    --surface: var(--tg-theme-secondary-bg-color, #f4f7fa);
    --ink:     var(--tg-theme-text-color, #101820);
    --muted:   var(--tg-theme-hint-color, #6b7a8a);
    --accent:  var(--tg-theme-button-color, #0f6a8b);
    --accent-ink: var(--tg-theme-button-text-color, #ffffff);
    --line:    color-mix(in srgb, var(--ink) 12%, transparent);
    --alert:   #c0392b;
    --alert-bg: color-mix(in srgb, var(--alert) 10%, transparent);
    /* Осторожность, а не тревога. Красный в этом продукте занят ошибками
       ввода — если красить им ещё и плохой курс, человек перестаёт
       различать «ты ошибся» и «сегодня невыгодно». Янтарный читается
       как «притормози» и не кричит. */
    --warn:    #b8791f;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 14px 14px 32px;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    position: relative;
  }

  /* Фон — свечение акцентом сверху, отдельным слоем под содержимым.
     Псевдоэлемент, а не background: так он одинаково ложится и на светлую,
     и на тёмную тему Telegram. Ничего не перехватывает по нажатиям. */
  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 260px;
    background: linear-gradient(180deg, var(--accent), transparent);
    opacity: .16;
    pointer-events: none;
    z-index: 0;
  }
  .wrap, .langs { position: relative; z-index: 1; }

  .wrap { display: flex; flex-direction: column; gap: 13px; max-width: 480px; margin: 0 auto; }

  .lbl {
    font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase;
    color: var(--muted); font-weight: 700;
  }

  .field {
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    padding: 10px 13px; display: flex; flex-direction: column; gap: 2px;
  }
  .field input, .field select {
    background: transparent; border: none; color: var(--ink);
    font-family: inherit; font-size: 21px; font-weight: 700; width: 100%;
    padding: 0; font-variant-numeric: tabular-nums;
  }
  /* Раскрытый список рисует система, и фон у него свой — почти всегда белый.
     Цвет текста наследуется от темы, поэтому в тёмной теме пункты
     оказывались светлыми на белом. Задаём паре фон и текст явно. */
  .field select option { background: var(--bg); color: var(--ink); }
  .field select { font-size: 16px; font-weight: 600; }
  .field input:focus, .field select:focus { outline: none; }
  .field:focus-within { border-color: var(--accent); }
  .field .hint { font-size: 12px; color: var(--muted); }

  button {
    font-family: inherit; font-size: 15px; font-weight: 700;
    border: none; border-radius: 12px; padding: 14px; width: 100%; cursor: pointer;
    background: var(--accent); color: var(--accent-ink);
  }
  /* Текст красим в --ink, а не в --accent: в тёмных темах Telegram цвет
     кнопки бывает почти чёрным, и надпись на прозрачном фоне пропадает. */
  button.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--accent); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ── Вердикт дня ────────────────────────────────────────────────
     Первый экран продукта и его главная ценность. За месяц курс рубля
     прошёл 9,5% — это больше денег, чем выбор сервиса и банка вместе.
     Поэтому цифра дня стоит выше формы, а не под ней. */
  .verdict {
    border-radius: 14px; padding: 15px 16px 13px;
    display: flex; flex-direction: column; gap: 9px;
    background: color-mix(in srgb, var(--tone) 12%, transparent);
    border: 1px solid color-mix(in srgb, var(--tone) 34%, transparent);
    --tone: var(--muted);
  }
  .verdict.good { --tone: var(--accent); }
  .verdict.bad  { --tone: var(--warn); }

  /* Шапка вердикта: слева слова, справа значок состояния. Значок нужен
     тем, кто листает быстро и текст не читает вовсе. */
  .verdict .vtop { display: flex; align-items: flex-start; gap: 10px; }
  .verdict .vh {
    font-size: 16.5px; font-weight: 800; line-height: 1.3;
    letter-spacing: -.01em; flex: 1;
  }
  .verdict .vbadge {
    flex: none; font-size: 11px; font-weight: 800; letter-spacing: .04em;
    padding: 4px 9px; border-radius: 999px; white-space: nowrap;
    background: color-mix(in srgb, var(--tone) 20%, transparent);
    color: var(--tone); font-variant-numeric: tabular-nums;
  }

  .verdict .vnums { display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap; }
  .verdict .vrate {
    font-size: 32px; font-weight: 800; color: var(--tone);
    font-variant-numeric: tabular-nums; letter-spacing: -.03em; line-height: 1.05;
  }
  .verdict .vavg { font-size: 12.5px; color: var(--muted); }
  .verdict .vmeta { font-size: 12px; color: var(--muted); }
  .verdict .vonsum {
    font-size: 15px; font-weight: 700; line-height: 1.35; padding-top: 2px;
  }
  .verdict .vspread {
    font-size: 12.5px; color: var(--muted); line-height: 1.4;
    padding-top: 1px;
  }
  .verdict .vspread b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .verdict .vhint {
    font-size: 12.5px; color: var(--ink); line-height: 1.4; font-weight: 600;
    border-top: 1px solid color-mix(in srgb, var(--tone) 25%, transparent);
    padding-top: 9px; margin-top: 2px;
  }

  /* График курса. Настоящий ряд ЦБ за 30 дней: одно движение глазом
     объясняет больше, чем абзац текста про волатильность. */
  .chart { display: flex; flex-direction: column; gap: 3px; }
  /* color задаёт currentColor для градиента заливки: так она повторяет
     цвет вердикта, и второго набора правил под каждое состояние не нужно. */
  .spark { width: 100%; height: 58px; display: block; overflow: visible; color: var(--tone); }
  .spark .ln { fill: none; stroke: var(--tone); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .spark .ar { fill: url(#zaliv); stroke: none; }
  .spark .av { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 3; opacity: .65; }
  .spark .dt { fill: var(--tone); }
  /* Ореол вокруг сегодняшней точки: на плотном ряду из тридцати значений
     обычный кружок теряется в линии. */
  .spark .dtg { fill: var(--tone); opacity: .22; }

  /* Подписи под графиком: крайние значения месяца и период. Без них
     линия красивая, но бессмысленная — не с чем сравнить. */
  .chart .osi {
    display: flex; justify-content: space-between; gap: 8px;
    font-size: 10.5px; color: var(--muted); font-variant-numeric: tabular-nums;
  }

  /* Шкала месяца: где сегодняшний курс между худшим и лучшим днём.
     Самая понятная часть экрана — положение точки читается без чисел. */
  .scale {
    position: relative; height: 6px; border-radius: 999px; margin: 3px 0 1px;
    background: linear-gradient(90deg,
      color-mix(in srgb, var(--warn) 45%, transparent),
      color-mix(in srgb, var(--muted) 28%, transparent),
      color-mix(in srgb, var(--accent) 55%, transparent));
  }
  .scale .tochka {
    position: absolute; top: 50%; width: 12px; height: 12px; border-radius: 50%;
    background: var(--tone); border: 2px solid var(--bg);
    transform: translate(-50%, -50%);
    transition: left .35s cubic-bezier(.2,.7,.3,1);
  }

  /* ── Результат ──────────────────────────────────────────────────── */
  .loss {
    background: color-mix(in srgb, var(--accent) 13%, transparent);
    border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent);
    border-radius: 12px; padding: 13px 15px; display: flex; flex-direction: column; gap: 2px;
  }
  .loss .t { font-size: 12px; color: var(--muted); font-weight: 600; }
  .loss .n {
    font-size: 27px; font-weight: 800; color: var(--accent);
    font-variant-numeric: tabular-nums; letter-spacing: -.02em;
  }
  .loss .s { font-size: 12.5px; color: var(--muted); }

  .card {
    /* color обязателен: .card — это button, а правило button выше красит
       текст в var(--accent-ink), то есть белым по светлому фону карточки */
    background: var(--surface); color: var(--ink);
    border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 13px; display: flex; flex-direction: column; gap: 4px;
    text-align: left; width: 100%; cursor: pointer;
  }
  .card.best { border-color: var(--accent); }
  .card .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .card .svc { font-size: 13.5px; font-weight: 700; }
  .card .tag {
    font-size: 10px; letter-spacing: .07em; text-transform: uppercase;
    font-weight: 800; color: var(--muted);
  }
  .card .tag.best { color: var(--accent); }
  .card .sum {
    font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.02em;
  }
  .card .brk { font-size: 11.5px; color: var(--muted); }

  /* Полоса под суммой: длина пропорциональна тому, сколько дойдёт.
     Два способа с одинаковым итогом дают одинаковые полосы — и это
     тоже правда, которую видно с одного взгляда, без чтения цифр.
     Начало шкалы не ноль, а 92% от лучшего: иначе полосы отличались бы
     на волосок и не говорили ничего. */
  .card .bar {
    height: 4px; border-radius: 999px; margin-top: 2px;
    background: color-mix(in srgb, var(--ink) 9%, transparent);
    overflow: hidden;
  }
  .card .bar i {
    display: block; height: 100%; border-radius: 999px;
    background: color-mix(in srgb, var(--muted) 55%, transparent);
    transition: width .35s cubic-bezier(.2,.7,.3,1);
  }
  .card.best .bar i { background: var(--accent); }

  /* Плашка потери. Раньше здесь стояла только разница между способами,
     а она бывает нулевой — и тогда главная потеря человека исчезала
     с экрана вовсе. Теперь показываем то, что есть всегда. */
  .loss .n small {
    font-size: 15px; font-weight: 700; color: var(--muted);
    letter-spacing: 0; margin-left: 6px;
  }

  .note { font-size: 12px; color: var(--muted); line-height: 1.45; }

  /* Откуда цифры. Свёрнуто по умолчанию: тому, кому достаточно цифры,
     это не мешает, а тот, кто хочет проверить, — раскрывает. */
  .src { font-size: 12px; color: var(--muted); }
  .src summary {
    cursor: pointer; font-weight: 700; padding: 6px 0;
    letter-spacing: .04em; text-transform: uppercase; font-size: 11px;
  }
  .src summary::marker { color: var(--accent); }
  .src ul { margin: 2px 0 0; padding-left: 18px; display: flex; flex-direction: column; gap: 5px; }
  .src li { line-height: 1.45; }

  /* ── Куда уходят деньги ─────────────────────────────────────────
     Главное обещание продукта — показать невидимое. Раньше разбор
     прятался в попапе, который открывают единицы. Теперь он на экране,
     и видно, что курс забирает больше комиссии. */
  .razbor {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 12px; padding: 13px 15px 12px;
    display: flex; flex-direction: column; gap: 9px;
  }
  .razbor .rt {
    font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase;
    color: var(--muted); font-weight: 700;
  }
  .razbor .rr { display: flex; flex-direction: column; gap: 5px; }
  .razbor .rl {
    display: flex; justify-content: space-between; align-items: baseline;
    gap: 10px; font-size: 13.5px;
  }
  .razbor .rl .k { color: var(--muted); }
  .razbor .rl .v { font-variant-numeric: tabular-nums; font-weight: 700; white-space: nowrap; }
  .razbor .rl.minus .v { color: var(--warn); }
  .razbor .rl.itog {
    border-top: 1px solid var(--line); padding-top: 8px; margin-top: 2px;
    font-size: 15px;
  }
  .razbor .rl.itog .k { color: var(--ink); font-weight: 700; }
  .razbor .rl.itog .v { font-size: 19px; color: var(--accent); letter-spacing: -.02em; }

  /* Полоса потерь: сколько от официального курса осталось человеку.
     Одна картинка вместо абзаца — видно, что забрали, и что дошло. */
  .razbor .rbar {
    display: flex; height: 7px; border-radius: 999px; overflow: hidden;
    background: color-mix(in srgb, var(--ink) 8%, transparent);
  }
  .razbor .rbar i { display: block; height: 100%; }
  .razbor .rbar .ost { background: var(--accent); }
  .razbor .rbar .pot { background: color-mix(in srgb, var(--warn) 70%, transparent); }

  /* Быстрый выбор суммы. Набирать «50000» на телефоне — пять точных
     попаданий по цифрам и открытая клавиатура поверх половины экрана.
     Одно нажатие вместо этого убирает главное трение перед цифрой,
     ради которой человек пришёл. Поле при этом никуда не делось. */
  .chips { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .chips .chip {
    width: auto; flex: 1 1 0; min-width: 62px;
    padding: 8px 6px; font-size: 13px; font-weight: 700; border-radius: 9px;
    background: transparent; color: var(--muted);
    border: 1.5px solid var(--line); font-variant-numeric: tabular-nums;
    transition: border-color .15s, color .15s;
  }
  .chips .chip.on { border-color: var(--accent); color: var(--accent); }

  /* Три шага расчёта. Исчезают, как только появился результат. */
  .steps {
    margin: 0; padding: 0 0 0 22px; display: flex; flex-direction: column; gap: 9px;
    font-size: 13.5px; color: var(--muted); line-height: 1.45;
  }
  .steps li::marker { color: var(--accent); font-weight: 800; }

  /* Подписка. Показывается ПОСЛЕ расчёта, а не до: просить разрешение
     писать у человека, который ещё ничего не получил, — верный отказ.
     Сначала польза, потом просьба. */
  .sub {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 12px; padding: 14px 15px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .sub .st { font-size: 14.5px; font-weight: 700; }
  .sub .sp { font-size: 12.5px; color: var(--muted); line-height: 1.45; }
  .sub .chlink {
    font-size: 12.5px; color: var(--accent); text-decoration: none;
    font-weight: 600; text-align: center; padding: 2px 0;
  }
  .sub .chlink::after { content: ' →'; }

  /* Сообщение о неверной сумме. Красное и прямо под полем: человек должен
     понять, что не так, не отводя глаз от того места, где он ошибся. */
  .err { margin: 6px 2px 0; font-size: 12.5px; color: var(--alert); font-weight: 600; }
  .field.bad { border-color: var(--alert); }

  /* Переключатель языка. Кнопки узкие, поэтому width:100% от общего
     правила button здесь надо перебить, иначе они растянутся на экран. */
  .langs { display: flex; gap: 6px; justify-content: flex-end; }
  .langs .lang {
    width: auto; padding: 5px 11px; font-size: 12px; font-weight: 700;
    letter-spacing: .06em; border-radius: 8px;
    background: transparent; color: var(--muted); border: 1.5px solid var(--line);
  }
  .langs .lang.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

  /* Служебный класс. !important здесь осознанно: любое правило вида
     .something { display: flex } объявленное ниже перебило бы его
     по порядку, и элемент бы не спрятался. Один раз наступили. */
  .hidden { display: none !important; }

  /* Первый запуск: объясняем, зачем это */
  .intro { display: flex; flex-direction: column; gap: 16px; padding: 22px 4px 0; }
  .intro h1 { font-size: 25px; font-weight: 800; margin: 0; line-height: 1.2; letter-spacing: -.02em; }
  .intro p { margin: 0; font-size: 16px; color: var(--muted); line-height: 1.55; }
  .intro .bignum {
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    padding: 16px 18px; display: flex; flex-direction: column; gap: 2px;
  }
  .intro .bignum .v {
    font-size: 18px; font-weight: 800; color: var(--accent);
    letter-spacing: -.01em; line-height: 1.3;
  }
  .intro .bignum .k { font-size: 13px; color: var(--muted); line-height: 1.45; }

  #results { display: flex; flex-direction: column; gap: 9px; }

  @media (prefers-reduced-motion: no-preference) {
    .verdict, .card, .loss { animation: poyavit .22s ease-out both; }
    @keyframes poyavit { from { opacity: 0; transform: translateY(4px); } }
  }
</style>
</head>

<body>
<div class="wrap">

  <!-- ── Язык ─────────────────────────────────────────────── -->
  <!-- Переключатель наверху и всегда виден: у многих телефон по-русски,
       а читать человек хочет на своём. Прятать его в меню нельзя. -->
  <div class="langs">
    <button class="lang" data-lang="uz" type="button">UZ</button>
    <button class="lang" data-lang="ru" type="button">RU</button>
  </div>

  <!-- ── Первый запуск ────────────────────────────────────── -->
  <div id="intro" class="intro hidden">
    <h1 data-i18n="intro.h1"></h1>
    <p data-i18n-html="intro.p1"></p>
    <div class="bignum">
      <span class="v" data-i18n="intro.big.v"></span>
      <span class="k" data-i18n="intro.big.k"></span>
    </div>
    <p data-i18n="intro.p2"></p>
    <button id="introOk" class="ghost" data-i18n="intro.ok"></button>
  </div>

  <!-- ── Вердикт дня ──────────────────────────────────────── -->
  <!-- Стоит выше формы намеренно: это единственное, что человек может
       узнать здесь и больше нигде, и это самая крупная сумма в расчёте. -->
  <div id="verdict" class="verdict hidden">
    <div class="vtop">
      <span class="vh" id="vHead"></span>
      <span class="vbadge" id="vBadge"></span>
    </div>
    <span class="vnums">
      <span class="vrate" id="vRate"></span>
      <span class="vavg" id="vAvg"></span>
    </span>

    <div class="chart">
      <svg class="spark" id="vSpark" viewBox="0 0 300 58" preserveAspectRatio="none"
           role="img" aria-hidden="true"></svg>
      <div class="osi">
        <span id="vOsL"></span>
        <span id="vOsR"></span>
      </div>
    </div>

    <!-- Где сегодняшний курс между худшим и лучшим днём месяца.
         Читается быстрее любых процентов. -->
    <div class="scale" id="vScale" role="img" aria-hidden="true">
      <span class="tochka" id="vDot" style="left:50%"></span>
    </div>

    <span class="vmeta" id="vMeta"></span>
    <span class="vonsum" id="vOnSum"></span>
    <!-- Что стоит выбор дня, в его деньгах. Абстрактные 9,5% не
         чувствует никто, а 673 000 сум чувствуют все. -->
    <span class="vspread" id="vSpread"></span>
    <span class="vhint" id="vHint"></span>
  </div>

  <!-- ── Ввод ─────────────────────────────────────────────── -->
  <div id="calcUI" class="wrap" style="padding:0">
    <div>
      <div class="lbl" data-i18n="lbl.send"></div>
      <div class="field" style="margin-top:6px">
        <input id="summa" type="number" inputmode="numeric" value="50000"
               min="1000" max="1000000" step="1000" maxlength="7">
        <span class="hint" data-i18n="hint.rub"></span>
      </div>
      <div class="chips" id="chips">
        <button class="chip" type="button" data-sum="10000">10 000</button>
        <button class="chip" type="button" data-sum="30000">30 000</button>
        <button class="chip" type="button" data-sum="50000">50 000</button>
        <button class="chip" type="button" data-sum="100000">100 000</button>
      </div>
      <p id="summaErr" class="err hidden"></p>
    </div>

    <!-- Банк получателя. Прячется целиком, когда проверенных курсов
         банков нет: пустой список в поле выбора — обещание данных,
         которых у нас нет. См. data.js, window.BANKS. -->
    <div id="bankBlock" class="hidden">
      <div class="lbl" data-i18n="lbl.bank"></div>
      <div class="field" style="margin-top:6px">
        <select id="bank"></select>
        <span class="hint" data-i18n="hint.bank"></span>
      </div>
    </div>

    <button id="schitat" data-i18n="btn.calc"></button>
  </div>

  <!-- ── До расчёта ───────────────────────────────────────── -->
  <div id="idle">
    <ol class="steps">
      <li data-i18n="idle.s1"></li>
      <li data-i18n="idle.s2"></li>
      <li data-i18n="idle.s3"></li>
    </ol>
  </div>

  <!-- ── Результат ────────────────────────────────────────── -->
  <!-- Заголовок плашки подставляется кодом: под одним и тем же числом
       здесь бывает разный смысл (разница между способами или потеря на
       курсе), и подпись обязана меняться вместе с ним. -->
  <div id="loss" class="loss hidden">
    <span class="t" id="lossT"></span>
    <span class="n" id="lossNum">—</span>
    <span class="s" id="lossSub"></span>
  </div>

  <!-- aria-live: экранный диктор должен объявить результат сам, иначе
       незрячий человек нажимает «Посчитать» и не узнаёт, что что-то
       изменилось. Polite, а не assertive: перебивать его на полуслове
       незачем, цифра подождёт полсекунды. -->
  <div id="results" aria-live="polite" aria-atomic="false"></div>

  <!-- Куда уходят деньги. Заполняется кодом после расчёта. -->
  <div id="razbor" class="razbor hidden">
    <span class="rt" data-i18n="br.t"></span>
    <div class="rbar" id="rBar" aria-hidden="true"></div>
    <div class="rr" id="rRows"></div>
  </div>

  <button id="share" class="ghost hidden" data-i18n="btn.share"></button>

  <!-- ── Подписка на оповещения ───────────────────────────── -->
  <div id="subCta" class="sub hidden">
    <span class="st" data-i18n="sub.t"></span>
    <span class="sp" data-i18n="sub.p"></span>
    <button id="subBtn" class="ghost" data-i18n="sub.btn"></button>
    <!-- Второй путь возврата, мягче первого: канал не пишет лично.
         Появляется только если канал заведён — см. CHANNEL_LINK. -->
    <a id="chLink" class="chlink hidden" target="_blank" rel="noopener"
       data-i18n="sub.ch"></a>
  </div>

  <p id="disclaimer" class="note hidden"></p>
  <p id="kursDate" class="note"></p>

  <!-- Откуда цифры. В денежном продукте это не мелкий шрифт внизу,
       а причина верить всему остальному: источники названы поимённо
       и проверяются за минуту. Свёрнуто, чтобы не мешать тем, кому
       достаточно цифры, и раскрывается тем, кто хочет убедиться. -->
  <details class="src">
    <summary data-i18n="src.t"></summary>
    <ul>
      <li data-i18n="src.cb"></li>
      <li data-i18n="src.svc"></li>
      <li id="srcUpd"></li>
      <li data-i18n="src.no"></li>
      <!-- Дорога на страницу под поиск, и она здесь по двум причинам.
           Человеку: там тот же курс с объяснением, откуда он взялся, —
           это следующий вопрос того, кто уже раскрыл «откуда цифры».
           Поисковику: `kurs.html` не была связана ни одной ссылкой, и
           дойти до неё он мог только через sitemap, о котором ему никто
           не сказал — robots.txt читается лишь из корня домена, а наш
           лежит в папке проекта.

           Текст ссылки стоит прямо в разметке, а не в i18n.js, хотя
           правило проекта обратное. Именно в этом случае оно бы всё и
           сломало: подписи, которые подставляет скрипт, поисковик не
           видит, и ссылка без слов не значит для него ничего. -->
      <li><a href="kurs.html">Rubl kursi bugun · Курс рубля к суму сегодня</a></li>
    </ul>
  </details>

</div>

<!-- Порядок важен: тексты → данные → формулы → экран.
     ?v= обязателен: Telegram держит файлы мини-аппа в кеше по нескольку
     часов, и без смены адреса человек продолжает видеть старую версию.
     Правило: поменял js — увеличил число здесь, иначе правка не доедет. -->
<script src="i18n.js?v=36"></script>
<script src="data.js?v=36"></script>
<script src="calc.js?v=36"></script>
<script src="app.js?v=36"></script>
</body>
</html>
