# Вторая дверь для утреннего поста: канал переживает падение Render.
#
# ЗАЧЕМ ЭТО ЕСТЬ. Канал — единственное, что приводит людей в продукт, а
# пишет в него бот на Render. Бесплатных часов там хватает примерно на
# месяц: с 21 по 30 августа бот молчал девять дней подряд, и канал молчал
# вместе с ним. Следующий раз ожидается около 20 сентября, и дальше
# каждый месяц. Данные приложения падение Render уже переживают —
# «Обновить данные» пересобирает их здесь же. Канал до сих пор нет.
#
# КАК ЭТО НЕ ДАЁТ ДВУХ ПОСТОВ. Работа сначала спрашивает сам Render и,
# если тот отвечает, молча выходит — автор поста всегда ровно один.
# Что публиковать и под какой отметкой, решает та же `utrenniy_post`, что
# работает у бота: одна голова на две двери. Отметку о сделанном работа
# кладёт на серверы Telegram, а проснувшийся бот забирает её себе — при
# запуске и первым проходом после девяти утра. Подробности и причины —
# в шапке `bot/post_iz_github.py`.
#
# ЧЕГО ЗДЕСЬ НЕТ. `DATABASE_URL` не задаётся и задан быть не может: это
# полный доступ к данным подписчиков, а секреты лежат в публичном
# репозитории. Внеочередной пост про рывок курса тоже остаётся у бота:
# он выходит после обеда и по своим правилам, а вторая дверь нужна не
# для полноты, а чтобы канал не молчал сутками.
#
# ПОКА СЕКРЕТОВ НЕТ, работа зелёная и говорит об этом строкой в журнале.
# Красная работа каждое утро означала бы письмо, которое перестают
# читать на третий день, — а вместе с ним перестают читать письма
# сторожа, и вот те приходят по делу.

name: Пост в канал, если Render молчит

on:
  schedule:
    # 11:00 и 15:00 по Ташкенту. Бот пишет сам с девяти утра, и к
    # одиннадцати у него был как минимум один часовой проход — то есть
    # мы вступаем только после того, как он свой шанс упустил.
    #
    # Второй раз — не ради второго поста, а ради второго шанса: GitHub
    # честно предупреждает, что запуск по расписанию может задержаться
    # или не случиться вовсе под нагрузкой, а у канала один публикатор.
    # Повтора это не даёт: к трём часам отметка уже стоит, и работа
    # молчит по той же причине, по какой молчал бы бот.
    - cron: '0 6,10 * * *'
  workflow_dispatch:

# Два запуска разом читали бы одну и ту же отметку до того, как её
# поставит первый, — и канал получил бы два поста подряд. Второй ждёт.
concurrency:
  group: post-v-kanal
  cancel-in-progress: false

# Только читать код. Заливать нечего, задачи заводит сторож.
permissions:
  contents: read

jobs:
  opublikovat:
    runs-on: ubuntu-latest
    # Четыре попытки достучаться до Render с ожиданием по минуте и
    # паузами по сорок секунд — это до шести минут только на вопрос «ты
    # жив?», и ещё минута на сбор курсов. Пятнадцати хватает с запасом.
    timeout-minutes: 15

    steps:
      # Версии действий держим на тех, что собраны под Node 24. Node 20
      # снят с поддержки, и GitHub гонит на нём старые действия
      # принудительно, предупреждая: сегодня это жёлтая строка в выводе,
      # завтра — упавшая работа. Понижать обратно нельзя.
      - name: Забрать репозиторий
        uses: actions/checkout@v5

      - name: Поставить Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # Ставить нечего, и это проверено сухим прогоном импорта: путь
      # публикатора обходится стандартной библиотекой. psycopg2 нужен
      # только под DATABASE_URL, а его здесь нет и не будет.
      - name: Опубликовать, если Render молчит
        working-directory: bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: python post_iz_github.py
