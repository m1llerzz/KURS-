# Сторож боевого: каждый день смотреть на продукт глазами человека.
#
# ЗАЧЕМ ЭТО ЕСТЬ. С 24 по 31 августа приложение было погашено — запас
# состарился, курсы сервисов скрылись по правилу свежести, и человек,
# открывший продукт, не видел ни одного способа. Никто этого не заметил
# восемь дней: бот молчал, канал молчал, а проверять боевое руками
# некогда и незачем — оно ведь «работает».
#
# Здесь его смотрит GitHub, каждое утро. Красное — заводится одна задача
# (issue) с перечнем того, что именно не работает, и Семён получает
# письмо. Позеленело — та же задача закрывается сама.
#
# ПОЧЕМУ ОДНА ЗАДАЧА, А НЕ ПО ШТУКЕ В ДЕНЬ. Сторож, который каждый день
# кладёт в почту одинаковое письмо, перестаёт читаться на третий день, и
# тогда он хуже, чем никакого. Письмо приходит на СМЕНУ состояния: когда
# сломалось и когда починилось.

name: Сторож боевого

on:
  schedule:
    # 08:30 по Ташкенту — через полчаса после утреннего обновления данных,
    # то есть смотрим уже на то, что люди увидят сегодня.
    - cron: '30 3 * * *'
  workflow_dispatch:

# Читать код и писать задачи. Заливать сторожу нечего.
permissions:
  contents: read
  issues: write

concurrency:
  group: storozh
  cancel-in-progress: false

jobs:
  smotret:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Забрать репозиторий
        uses: actions/checkout@v4

      - name: Поставить Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Проверке боевого зависимости не нужны: она ходит по сети тем, что
      # уже есть в Python. Ставить нечего — и хорошо: сторож, который сам
      # может упасть на установке, сторожит плохо.
      - name: Посмотреть на боевое
        id: smotr
        run: |
          set +e
          python proverit_zhivoe.py > otchet.txt 2>&1
          echo "kod=$?" >> "$GITHUB_OUTPUT"
          cat otchet.txt

      - name: Завести или закрыть тревогу
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ZAGOLOVOK="Сторож: у людей не работает"

          # Ищем СПИСКОМ, а не поиском: поисковый индекс GitHub отстаёт на
          # минуты, и по нему сторож завёл бы вторую задачу поверх первой.
          NOMER=$(gh issue list --state open --limit 100 --json number,title \
                    --jq "[.[] | select(.title == \"$ZAGOLOVOK\") | .number] | first // empty")

          KRASNOE=$(grep '^- ' otchet.txt || true)
          KOGDA=$(date -u +'%d.%m.%Y %H:%M UTC')

          if [ "${{ steps.smotr.outputs.kod }}" != "0" ]; then
            TELO=$(printf 'Проверка боевого от %s покраснела.\n\n```\n%s\n```\n\nЧто делать — по порядку в `DEYSTVIYA-SEMYONA.md`.\nПовторяется каждое утро; задача закроется сама, когда всё позеленеет.\n' "$KOGDA" "$KRASNOE")
            if [ -z "$NOMER" ]; then
              gh issue create --title "$ZAGOLOVOK" --body "$TELO"
              echo "Тревога заведена."
            else
              gh issue edit "$NOMER" --body "$TELO"
              echo "Тревога №$NOMER обновлена — письма не будет, состояние прежнее."
            fi
          elif [ -n "$NOMER" ]; then
            gh issue comment "$NOMER" --body "Боевое позеленело: $KOGDA. Закрываю."
            gh issue close "$NOMER"
            echo "Тревога №$NOMER закрыта."
          else
            echo "Боевое работает, тревог нет."
          fi
