# Обновление данных приложения без единой пары рук.
#
# ЗАЧЕМ ЭТО ЕСТЬ. Приложение показывает курс, и у курса есть правило
# свежести: старше 24 часов — вилка, старше 72 — прячем совсем, совет по
# устаревшим данным не даём вовсе. Собирал данные бот на Render. Бот
# приостановлен с 21 августа, и продукт погас ровно по этому правилу:
# 24 августа плюс 96 часов — и людям перестали показывать способы.
#
# То есть у продукта была одна точка отказа, и она уже сработала. Здесь
# её больше нет: данные пересобирает GitHub у себя, четыре раза в сутки,
# бесплатно на публичном репозитории, и заливает сам. Render может
# лежать сколько угодно — приложение остаётся живым.
#
# ЧЕГО ЭТО НЕ ДЕЛАЕТ. Не заменяет бота как собеседника: разговор,
# подписки, посты в канал и /api/event остаются на Render. Здесь только
# то, что стареет само: курсы, страница поиска, картинка карточки.
#
# ПРАВО НА ЗАЛИВКУ. Берётся из встроенного GITHUB_TOKEN, а не из личного
# токена — тот выдан только на чтение, и из-за этого заливка стоит.
# Встроенному хватает permissions: contents: write ниже.

name: Обновить данные

on:
  schedule:
    # 08:00, 14:00, 20:00 и 02:00 по Ташкенту. ЦБ публикует курс ночью,
    # первый запуск приходится на утро — люди открывают приложение уже
    # со свежим числом. Четырёх раз в сутки хватает с большим запасом:
    # «точно» держится 24 часа, а между запусками проходит шесть.
    - cron: '0 3,9,15,21 * * *'
  workflow_dispatch:

# Два запуска разом переписали бы одни и те же файлы и разъехались бы в
# заливке. Второй ждёт, пока закончит первый.
concurrency:
  group: obnovlenie-dannyh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  obnovit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Забрать репозиторий
        uses: actions/checkout@v4

      - name: Поставить Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Поставить Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Pillow рисует картинку карточки, sqlglot разбирает SQL в проверках.
      # В репозиторий они не кладутся: боту на Render нужен только psycopg2.
      - name: Зависимости Python
        run: python -m pip install --quiet pillow sqlglot

      # jsdom нужен трём наборам проверок из девяти. Без него они молча
      # пропускаются, а пропущенное не считается пройденным.
      - name: Зависимости Node
        run: npm install --no-audit --no-fund

      # Картинка карточки обязана нарисовать знак рубля. Шрифт без ₽ PIL
      # молча заменяет пустым квадратом посреди «1 ₽ = 136,73».
      # DejaVu Sans рубль умеет, и на ubuntu-latest он уже стоит — строка
      # ниже страхует от того дня, когда перестанет.
      - name: Шрифты для картинки
        run: sudo apt-get install -y --no-install-recommends fonts-dejavu-core

      - name: Пересобрать данные, страницу поиска и картинку
        working-directory: bot
        run: python obnovit_vsyo.py

      # Порядок тот же, что и руками: сначала проверки, потом заливка.
      # Красное — не заливаем. Пропущенное — тоже: набор, который не
      # умеет покраснеть, ничего не охраняет.
      - name: Проверки
        run: |
          set -o pipefail
          python proverit.py 2>&1 | tee /tmp/proverki.txt
          if grep -q "пропущено" /tmp/proverki.txt; then
            echo "::error::Наборы проверок пропущены — значит не проверены. Заливать нельзя."
            exit 1
          fi

      - name: Залить, если что-то изменилось
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Курс и условия те же — заливать нечего."
            exit 0
          fi

          git config user.name  "obnovlenie-dannyh"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Курс в сообщение коммита — чтобы история заливок читалась как
          # история курса, а не как череда одинаковых строк.
          #
          # Берём с той строки, где лежит курс ЦБ, а не первое совпадение
          # в файле: ключ rub_uzs есть и у сервисов, и в ряде истории, и
          # первым в data.js идёт курс сервиса, а не ЦБ.
          KURS=$(grep -o 'KURSY_ZAPAS.*' data.js | grep -o '"rub_uzs":[^,}]*' | grep -o '[0-9][0-9.]*')

          git add -A
          git commit -m "data: курс ЦБ ${KURS:-?}, пересборка по расписанию"

          # Между началом работы и заливкой Семён мог залить своё.
          # Перечитываем и встраиваемся поверх, а не затираем.
          git pull --rebase origin main
          git push origin HEAD:main
